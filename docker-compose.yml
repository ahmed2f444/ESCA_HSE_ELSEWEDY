version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esca-hse-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=${DB_HOST:-zephyr.proxy.rlwy.net}
      - DB_PORT=${DB_PORT:-17885}
      - DB_NAME=${DB_NAME:-railway}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DDL_AUTO=none
      - SQL_INIT_MODE=never
      - APP_SECURITY_ENABLED=false
      - APP_DEMO_DATA_ENABLED=false
      - AUTOMATION_CLIENT_ID=${AUTOMATION_CLIENT_ID:-esca-hse-automation}
      - AUTOMATION_CLIENT_SECRET=${AUTOMATION_CLIENT_SECRET:-local-automation-secret-change-me}
      - CORS_ALLOWED_ORIGINS=http://localhost:5180,http://localhost:3000,http://localhost:3100,http://localhost:3200,http://frontend:5180
    restart: unless-stopped

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: esca-hse-ai-agent
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-root}:${DB_PASSWORD}@${DB_HOST:-zephyr.proxy.rlwy.net}:${DB_PORT:-17885}/${DB_NAME:-railway}
      - DB_HOST=${DB_HOST:-zephyr.proxy.rlwy.net}
      - DB_PORT=${DB_PORT:-17885}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-railway}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - GROQ_MODEL=openai/gpt-oss-120b
      - LOCAL_LLM_ENABLED=true
      - LOCAL_LLM_BASE_URL=http://localhost:11434/v1
      - LOCAL_LLM_MODEL=esca-agent-local
      - SPRING_API_BASE_URL=http://backend:8080
      - AUTOMATION_CLIENT_ID=${AUTOMATION_CLIENT_ID:-esca-hse-automation}
      - AUTOMATION_CLIENT_SECRET=${AUTOMATION_CLIENT_SECRET:-local-automation-secret-change-me}
      - AUTOMATION_DELIVERY_MODE=spring
      - AUTOMATION_LIVE_ENABLED=true
      - ENABLE_SCHEDULER=true
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esca-hse-frontend
    ports:
      - "5180:5180"
    environment:
      - VITE_USE_MOCK=false
      - VITE_API_BASE_URL=/api
      - VITE_AGENT_BASE_URL=/agent
    depends_on:
      - backend
      - ai-agent
    restart: unless-stopped
