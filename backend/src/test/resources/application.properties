spring.datasource.url=jdbc:h2:mem:esca;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
app.cors.allowed-origins=http://localhost:3100,http://localhost:3200
app.security.enabled=false
app.security.demo-users-enabled=false
app.demo-data.enabled=false
app.security.jwt-secret=test-secret-with-sufficient-length
app.automation.client-id=esca-hse-automation
app.automation.client-secret=test-automation-secret
